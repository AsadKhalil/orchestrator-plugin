name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/check-package.mjs

  # The packed plugin in a real, isolated OpenCode 2.3.0 server with a mock model (scripts/smoke-host-model.mjs), on each system.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Get the OpenCode 2.3.0 binary for this system
        shell: bash
        run: |
          platform=$(node -p "({ darwin: 'darwin', linux: 'linux', win32: 'windows' })[process.platform]")
          name="@opencode/cli-$platform-$(node -p process.arch)"
          npm install --prefix "$RUNNER_TEMP/opencode" --ignore-scripts --no-save --no-audit --no-fund "$name@2.3.0"
          bin="$RUNNER_TEMP/opencode/node_modules/$name/bin/opencode"
          if [ "$platform" = windows ]; then bin="$bin.exe"; fi
          "$bin" --version
          echo "RELAY_SMOKE_CLI=$bin" >> "$GITHUB_ENV"
      - run: npm run smoke:host:model
